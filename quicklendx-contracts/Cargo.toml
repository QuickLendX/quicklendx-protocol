[package]
name = "quicklendx-contracts"
version = "0.1.0"
edition = "2021"

[lib]
# rlib for tests/integration; cdylib for WASM contract builds.
crate-type = ["rlib", "cdylib"]

[dependencies]
soroban-sdk = { version = "25.1.1", features = ["alloc"] }
proptest = { version = "1.4", optional = true }

[dev-dependencies]
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
soroban-sdk = { version = "25.1.1", features = ["testutils"] }
quicklendx-contracts = { path = ".", features = ["testutils"] }
ed25519-dalek = "2.2"


[features]
# Enable fuzz tests (disabled by default to avoid blocking CI)
fuzz-tests = ["dep:proptest"]
# Allow selectively compiling legacy test modules (kept off in CI)
legacy-tests = []
# Feature-gated logging and structured diagnostics
diagnostics = []
testutils = ["soroban-sdk/testutils"]

# Integration tests written against the full contract API; the crate root is
# currently a stub, so they only build with the `legacy-tests` feature.
[[test]]
name = "auth_verification_test"
path = "tests/auth_verification_test.rs"
required-features = ["legacy-tests"]

[[test]]
name = "bid_acceptance_replay"
path = "tests/bid_acceptance_replay.rs"
required-features = ["legacy-tests"]

[[test]]
name = "investor_kyc_tier"
path = "tests/investor_kyc_tier.rs"
required-features = ["legacy-tests"]

[[test]]
name = "invoice_lifecycle_e2e"
path = "tests/invoice_lifecycle_e2e.rs"
required-features = ["legacy-tests"]

[[test]]
name = "pagination_match_over_under"
path = "tests/pagination_match_over_under.rs"
required-features = ["legacy-tests"]

[[test]]
name = "profit_fee_golden"
path = "tests/profit_fee_golden.rs"
required-features = ["legacy-tests"]

[[test]]
name = "test_admin_lookalike"
path = "tests/test_admin_lookalike.rs"
required-features = ["legacy-tests"]

[[test]]
name = "test_treasury_rotation"
path = "tests/test_treasury_rotation.rs"
required-features = ["legacy-tests"]
