openapi: 3.0.0
info:
  title: QuickLendX Protocol API
  description: |
    Backend API service for the QuickLendX invoice factoring protocol.

    ## Pagination

    All list endpoints use **cursor-based pagination** for stable, efficient traversal.

    ### Request parameters

    | Parameter | Type    | Default | Max | Description                                      |
    |-----------|---------|---------|-----|--------------------------------------------------|
    | `limit`   | integer | 20      | 100 | Number of items per page. Clamped to [1, 100].   |
    | `cursor`  | string  | —       | —   | Opaque cursor from a previous response's `next_cursor`. |

    ### Response shape

    Every list endpoint returns a `PageResult` object:

    ```json
    {
      "data": [ ... ],
      "next_cursor": "eyJpZCI6Ii4uLiIsInNvcnRfdmFsIjoxNzQ1NTk5fQ",
      "has_more": true
    }
    ```

    - `data` — the current page of items.
    - `next_cursor` — opaque string to pass as `cursor` on the next request; `null` when there are no more pages.
    - `has_more` — `true` when more items exist beyond this page.

    ### Sort order

    | Endpoint       | Primary sort key | Direction | Tiebreaker |
    |----------------|-----------------|-----------|------------|
    | `/invoices`    | `created_at`    | DESC      | `id` ASC   |
    | `/bids`        | `timestamp`     | DESC      | `bid_id` ASC |
    | `/settlements` | `timestamp`     | DESC      | `id` ASC   |
    | `/portfolio`   | `invested_at`   | DESC      | `id` ASC   |

    ### Security

    - Limit is always clamped server-side; clients cannot trigger unbounded scans.
    - Cursors are opaque base64url-encoded tokens; do not parse or construct them manually.
    - A malformed or tampered cursor returns `400 INVALID_PAGINATION`.
    - No `total` count is exposed to prevent data-inference attacks.

  version: 1.0.0
  contact:
    name: QuickLendX Team
    url: https://github.com/QuickLendX/quicklendx-protocol

servers:
  - url: http://localhost:3001/api/v1
    description: Local development server

paths:
  /health:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: Health check
      description: Returns the status of the API service and connectivity.
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.0.0
                timestamp: '2026-01-01T00:00:00.000Z'

  /status:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: Runtime status and rate limit policy snapshot
      description: Returns indexer lag status plus the active public rate-limit thresholds.
      responses:
        "200":
          description: Runtime status with live rate-limit policy values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                lag: 0
                warnThreshold: 10
                criticalThreshold: 50
                level: none
                isDegraded: false
                isCritical: false
                checkedAt: '2026-01-01T00:00:00.000Z'
                rateLimits:
                  global:
                    id: global
                    scope: all public API endpoints
                    limit: 100
                    windowSeconds: 60
                    blockSeconds: 60
                    key: client-ip
                    headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
                  perKey:
                    id: perKey
                    scope: all API endpoints after authentication context is available
                    limit: 60
                    windowSeconds: 60
                    blockSeconds: 60
                    key: api-key-or-client-ip
                    headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
                _system:
                  status: operational
                  degraded: false
                  lag: 0
                  level: none

  /invoices:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: List invoices (paginated)
      description: |
        Returns a cursor-paginated list of invoices sorted by `created_at DESC, id ASC`.

        **Example — first page:**
        ```
        GET /invoices?limit=20
        ```

        **Example — next page:**
        ```
        GET /invoices?limit=20&cursor=<next_cursor from previous response>
        ```
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: business
          in: query
          schema:
            type: string
          description: Filter by business address
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
      responses:
        "200":
          description: Paginated list of invoices
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - next_cursor
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                      properties:
                        id: { type: string }
                        business: { type: string }
                        amount: { type: string, description: "i128 as string" }
                        currency: { type: string }
                        due_date: { type: integer, format: int64 }
                        status: { $ref: "#/components/schemas/InvoiceStatus" }
                        description: { type: string }
                        category: { $ref: "#/components/schemas/InvoiceCategory" }
                        tags:
                          type: array
                          items: { type: string }
                        metadata: { $ref: "#/components/schemas/InvoiceMetadata" }
                        created_at: { type: integer, format: int64 }
                        updated_at: { type: integer, format: int64 }
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
                  freshness:
                    $ref: '#/components/schemas/FreshnessMetadata'
                  _system:
                    type: object
                    properties:
                      status: { type: string }
                      degraded: { type: boolean }
                      lag: { type: integer }
                      level: { type: string }
              example:
                data: []
                next_cursor: null
                has_more: false
    post:
      summary: Create an invoice
      operationId: createInvoice
      responses:
        "201":
          description: Invoice created

  /invoices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: Get invoice by ID
      operationId: getInvoiceById
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  message: 'Invoice not found'
                  code: INVOICE_NOT_FOUND

  /bids:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: List ranked bids for an invoice (paginated)
      description: |
        Returns a cursor-paginated list of ranked bids for a given invoice, sorted by
        contract ranking semantics: (1) profit DESC, (2) expected_return DESC, (3) bid_amount DESC,
        (4) timestamp DESC, (5) bid_id ASC.

        Only returns Placed bids. Query parameter `invoice_id` is **required**.
      security:
        - {}  # Optional authentication
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: invoice_id
          in: query
          required: true
          schema:
            type: string
            format: hex
            example: "0x1234567890abcdef..."
          description: Invoice ID to filter bids
        - name: investor
          in: query
          schema:
            type: string
            format: stellar-address
            example: "GBSXVD727UNXJZ7ZM4VCXBTK3UMPXR7O6LLXS7XVOECGDYH3XFNV7C5K"
          description: Optional filter by investor address
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BidStatus"
          description: Optional filter by bid status (default Placed only)
      responses:
        "200":
          description: Paginated ranked bids
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bid"
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
        "400":
          description: Missing required invoice_id query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  message: "invoice_id is required"
                  code: "MISSING_REQUIRED_FIELD"
    post:
      x-rate-limit:
        policies: [global, perKey]
      operationId: createBid
      summary: Place a new bid on a Verified invoice
      description: |
        Creates a new bid for an investor on a Verified invoice.

        Requires authentication (Bearer token in Authorization header).

        **Validation rules:**
        - Invoice must be in Verified status
        - Investor cannot have an active bid on the same invoice (no duplicates)
        - bid_amount must be > 0
        - expected_return must be >= bid_amount
        - expiration_timestamp must be a positive integer
        - The investor's aggregate USD-equivalent exposure (active bids +
          unsettled settlements across MOCK_BIDS, MOCK_SETTLEMENTS, and the
          persisted stores) plus this new bid must not exceed
          `EXPOSURE_CAP_PER_INVESTOR_USD`. Otherwise the request is rejected
          with `429 EXPOSURE_CAP_EXCEEDED` before any chain interaction.
      security:
        - BearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag precondition for the invoice being bid on. When present and the invoice ETag doesn't match, the server returns 412 Precondition Failed.
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
            format: date-time
          description: Date precondition for the invoice being bid on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice_id
                - bid_amount
                - expected_return
                - expiration_timestamp
              properties:
                invoice_id:
                  type: string
                  format: hex
                  example: "0x1234567890abcdef..."
                  description: Invoice ID to bid on
                bid_amount:
                  type: string
                  pattern: "^[0-9]+$"
                  example: "1000000"
                  description: Bid amount (as numeric string for JSON safety)
                expected_return:
                  type: string
                  pattern: "^[0-9]+$"
                  example: "1500000"
                  description: Expected return (must be >= bid_amount, as numeric string)
                expiration_timestamp:
                  type: integer
                  example: 1745599232
                  description: Unix timestamp when this bid expires
                currency:
                  type: string
                  pattern: "^[A-Za-z]{3,4}$"
                  example: "USDC"
                  description: |
                    Optional currency tag. Defaults to `USDC`. The exposure
                    service normalizes the amount to USD-equivalent using
                    the configured currency rate table.
            examples:
              standard:
                description: Standard bid with expected return 1.5x bid amount
                value:
                  invoice_id: "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
                  bid_amount: "1000000"
                  expected_return: "1500000"
                  expiration_timestamp: 1745599232
                  currency: "USDC"
      responses:
        "201":
          description: Bid created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Bid"
        "400":
          description: Invalid bid parameters (non-Verified invoice, duplicate bid, validation failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: string
                        enum:
                          - INVALID_BID
                          - VALIDATION_ERROR
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          description: |
            Investor exposure cap would be exceeded. The cap is configured
            via `EXPOSURE_CAP_PER_INVESTOR_USD` and is denominated in whole
            USD units (the response carries micro-USD strings for precision).
            The investor should reduce active exposure (e.g. wait for a
            settlement to finalize) before retrying.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [message, code]
                    properties:
                      message:
                        type: string
                        description: Human-readable description of why the cap was exceeded.
                      code:
                        type: string
                        enum: [EXPOSURE_CAP_EXCEEDED]
                      currentExposureUsd:
                        type: string
                        description: Current USD-equivalent exposure for the investor (micro-USD, BigInt as string).
                      attemptedUsd:
                        type: string
                        description: USD-equivalent of the rejected bid (micro-USD, BigInt as string).
                      capUsd:
                        type: string
                        description: Configured per-investor cap (micro-USD, BigInt as string).
                      investor:
                        type: string
                        description: Investor (Stellar address) whose cap would be exceeded.
              example:
                error:
                  message: "Investor GAX... exposure cap would be exceeded: current=1100000000000000, attempted=500000000000000, cap=1500000000000000"
                  code: EXPOSURE_CAP_EXCEEDED
                  currentExposureUsd: "1100000000000000"
                  attemptedUsd: "500000000000000"
                  capUsd: "1500000000000000"
                  investor: "GAXMFSADZVDXTJSLL3HZJFVYH4JGBQBMX3I2WGPKH3YKRXL7ZJXZK23Q"

  /bids/{invoiceId}/best:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: Get the best bid for an invoice
      description: |
        Returns the highest-ranked (best) bid for an invoice, or 404 if no Placed bids exist.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: hex
          description: Invoice ID
      responses:
        "200":
          description: Best bid for the invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Bid"
        "404":
          description: No bids found for this invoice

  /bids/{invoiceId}/ranked:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: Get all ranked bids for an invoice
      description: |
        Returns all Placed bids for an invoice ranked by contract semantics.
        (best first: profit DESC, expected_return DESC, bid_amount DESC, timestamp DESC, bid_id ASC)
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: hex
          description: Invoice ID
      responses:
        "200":
          description: Ranked bids
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bid"

  /settlements:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: List settlements (paginated)
      description: |
        Returns a cursor-paginated list of settlements sorted by `timestamp DESC, id ASC`.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: invoice_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of settlements
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - next_cursor
                  - has_more
                  - freshness
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Settlement"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next page, or null when there are no more pages.
                  has_more:
                    type: boolean
                    description: Whether more settlements exist beyond this page.
                  freshness:
                    $ref: '#/components/schemas/FreshnessMetadata'
                  _system:
                    type: object
                    properties:
                      status: { type: string }
                      degraded: { type: boolean }
                      lag: { type: integer }
                      level: { type: string }
              example:
                data: []
                next_cursor: null
                has_more: false
                freshness:
                  lastIndexedLedger: 100000
                  indexLagSeconds: 0
                  lastUpdatedAt: "2026-06-23T17:00:00Z"
                  cursor: "100000_0"

  /settlements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '0xsettle123'
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: Get settlement by ID
      operationId: getSettlementById
      responses:
        "200":
          description: Settlement details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "500":
          description: Internal Server Error (e.g. database table missing in test env)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  message: 'no such table: settlements'
                  code: SQLITE_ERROR

  /portfolio:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: List investor portfolio (paginated)
      description: |
        Returns a cursor-paginated list of portfolio entries for a given investor,
        sorted by `invested_at DESC, id ASC`.

        The `investor` query parameter is **required**.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: investor
          in: query
          required: true
          schema:
            type: string
          description: Investor address (Stellar public key)
      responses:
        '200':
          description: Paginated portfolio entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPageResult'
        '400':
          $ref: '#/components/responses/PaginationError'

  /invoices/{id}/disputes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: List disputes for an invoice
      operationId: listDisputesByInvoice
      responses:
        "200":
          description: Paginated list of disputes for an invoice
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - next_cursor
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - invoice_id
                        - initiator
                        - reason
                        - status
                        - created_at
                      properties:
                        id: { type: string }
                        invoice_id: { type: string }
                        initiator: { type: string }
                        reason: { type: string }
                        status: { $ref: "#/components/schemas/DisputeStatus" }
                        created_at: { type: integer, format: int64 }
                        contract_version: { type: integer }
                        event_schema_version: { type: integer }
                        indexed_at: { type: string }
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
                  _system:
                    type: object
                    properties:
                      status: { type: string }
                      degraded: { type: boolean }
                      lag: { type: integer }
                      level: { type: string }
              example:
                data: []
                next_cursor: null
                has_more: false

  /notifications/preferences/{userId}:
    get:
      x-rate-limit:
        policies: [global, perKey]
      summary: Get user notification preferences
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: User identifier (Stellar address)
      responses:
        '200':
          description: User notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotificationPreferences'
        '400':
          description: Invalid userId parameter
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - caller does not own this userId
        '404':
          description: User preferences not found
    put:
      x-rate-limit:
        policies: [global, perKey]
      operationId: updateNotificationPreferences
      summary: Update user notification preferences
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: User identifier (Stellar address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferences'
            examples:
              enableAll:
                description: Enable all notification types
                value:
                  email_enabled: true
                  email_address: "user@example.com"
                  notifications:
                    invoice_funded: true
                    payment_received: true
                    dispute_opened: true
                    dispute_resolved: true
      responses:
        '200':
          description: Preferences updated successfully
        '202':
          description: Email change pending verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_required:
                    type: boolean
                    example: true
        '400':
          description: Invalid request data
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - caller does not own this userId

  /notifications/preferences/{userId}/email/verify:
    post:
      x-rate-limit:
        policies: [global, perKey]
      summary: Verify and activate new notification email address
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: User identifier (Stellar address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: 24h HMAC single-use verification token
      responses:
        '200':
          description: Email verified and activated successfully
        '400':
          description: Token expired or already used
        '403':
          description: Invalid token or user mismatch

  /notifications/unsubscribe/{userId}:
    post:
      x-rate-limit:
        policies: [global, perKey]
      summary: Unsubscribe user from email notifications
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: User identifier (Stellar address)
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Unguessable HMAC-SHA256 unsubscribe token
      responses:
        '200':
          description: Successfully unsubscribed
        '400':
          description: Invalid userId parameter
        '403':
          description: Invalid or missing unsubscribe token

  /exports/generate:
    post:
      x-rate-limit:
        policies: [global, perKey, export]
      summary: Generate a signed data export link
      description: Returns a short-lived link to download all user-scoped data (invoices, bids, settlements) in CSV or JSON format.
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: The desired export format.
      responses:
        "200":
          description: Export link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  download_url:
                    type: string
                    example: "/api/v1/exports/download/SIGNED_TOKEN"
                  expires_in:
                    type: string
                    example: "1 hour"
        "401":
          description: Authentication required
        "429":
          description: Too many concurrent export jobs. Please try again later.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [message, code]
                    properties:
                      message:
                        type: string
                        description: Human-readable error message.
                      code:
                        type: string
                        enum: [EXPORT_CONCURRENCY_EXCEEDED]
              example:
                error:
                  message: "Too many concurrent export jobs. Please try again later."
                  code: "EXPORT_CONCURRENCY_EXCEEDED"

  /exports/download/{token}:
    get:
      x-rate-limit:
        policies: [global, perKey, export]
      summary: Download exported data
      description: >
        Serves the export file using a signed one-shot token. The file is
        streamed from disk and deleted immediately after the first successful
        download. Subsequent requests with the same token return 401.
        The token expires after the configured TTL (default 1 hour).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Signed token representing the export request.
      responses:
        "200":
          description: Export file content (one-shot; file deleted after response)
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="quicklendx-export-USER-2026-01-01.json"'
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
        "401":
          description: Invalid, expired, or already-consumed token

  /events:
    post:
      x-rate-limit:
        policies: [global, perKey]
      operationId: processBlockchainEvents
      summary: Process blockchain events for notifications
      description: Internal endpoint for indexer to post events that trigger notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - type: array
                  items:
                    $ref: '#/components/schemas/Event'
            examples:
              singleEvent:
                description: Single blockchain event
                value:
                  type: "InvoiceCreated"
                  data:
                    invoice_id: "0x123abc"
                    amount: "1000000"
              multipleEvents:
                description: Array of blockchain events
                value:
                  - type: "InvoiceCreated"
                    data:
                      invoice_id: "0x123abc"
                      amount: "1000000"
                  - type: "BidPlaced"
                    data:
                      bid_id: "0xbid123"
                      invoice_id: "0x123abc"
      responses:
        '200':
          description: Events processed successfully
        '500':
          description: Internal server error

        "403":
          description: Insufficient admin role permissions

  /webhooks/subscribers:
    post:
      summary: Register a webhook subscriber
      description: Registers a new webhook subscriber with initial signing secret. Requires webhooks:manage scope.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subscriber_id
              properties:
                subscriber_id:
                  type: string
                grace_period_seconds:
                  type: integer
                  default: 3600
                algorithm:
                  type: string
                  enum: [hmac-sha256, ed25519]
                  default: hmac-sha256
      responses:
        "201":
          description: Subscriber successfully registered
        "400":
          description: Invalid request body
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Insufficient permissions (requires webhooks:manage)
        "409":
          description: Subscriber already exists

  /webhooks/subscribers/{subscriberId}:
    get:
      summary: Get webhook subscriber state
      description: Returns public rotation state. Requires ownership or security_admin / super_admin role.
      security:
        - BearerAuth: []
      parameters:
        - name: subscriberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public rotation state
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Insufficient permissions (requires webhooks:manage)
        "404":
          description: Subscriber not found

  /webhooks/subscribers/{subscriberId}/rotate:
    post:
      summary: Initiate webhook secret rotation
      description: Generates a new pending secret. Requires ownership or security_admin / super_admin role.
      security:
        - BearerAuth: []
      parameters:
        - name: subscriberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_period_seconds:
                  type: integer
                  default: 3600
      responses:
        "202":
          description: Rotation initiated
        "400":
          description: Invalid request body
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Insufficient permissions (requires webhooks:manage)
        "404":
          description: Subscriber not found
        "409":
          description: Rotation already in progress

  /webhooks/subscribers/{subscriberId}/rotate/finalize:
    post:
      summary: Finalize webhook secret rotation
      description: Promotes pending secret to primary. Requires ownership or security_admin / super_admin role.
      security:
        - BearerAuth: []
      parameters:
        - name: subscriberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rotation finalized
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Insufficient permissions (requires webhooks:manage)
        "404":
          description: Subscriber not found
        "409":
          description: No rotation in progress

  /webhooks/subscribers/{subscriberId}/rotate/cancel:
    post:
      summary: Cancel webhook secret rotation
      description: Cancels pending rotation. Requires ownership or security_admin / super_admin role.
      security:
        - BearerAuth: []
      parameters:
        - name: subscriberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rotation canceled
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Insufficient permissions (requires webhooks:manage)
        "404":
          description: Subscriber not found
        "409":
          description: No rotation in progress

