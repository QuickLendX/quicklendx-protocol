components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token

  schemas:
    HealthResponse:
      type: object
      description: Health check payload returned by GET /health.
      required:
        - status
        - version
        - timestamp
      properties:
        status:
          type: string
          description: Service health status.
          enum:
            - ok
            - error
        version:
          type: string
          description: Running service version.
          example: 1.0.0
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 timestamp of the health probe.

    StatusResponse:
      type: object
      required:
        - lag
        - warnThreshold
        - criticalThreshold
        - rateLimits
      properties:
        lag:
          type: integer
        warnThreshold:
          type: integer
        criticalThreshold:
          type: integer
        isDegraded:
          type: boolean
        isCritical:
          type: boolean
        rateLimits:
          type: object
          additionalProperties: true

    FreshnessMetadata:
      type: object
      description: >
        Data freshness metadata. Clients SHOULD warn users when indexLagSeconds > 30
        and SHOULD block irreversible financial actions when indexLagSeconds > 120.
        Only public ledger data is exposed — no node addresses or network topology.
      required:
        - lastIndexedLedger
        - indexLagSeconds
        - lastUpdatedAt
        - cursor
      properties:
        lastIndexedLedger:
          type: integer
          format: int64
          description: Last ledger sequence number processed by the indexer.
          example: 1042857
        indexLagSeconds:
          type: number
          format: double
          description: >
            Seconds the indexer is behind the chain tip.
            0 when the indexer is current. Computed as lagLedgers × 5 (Stellar ~5 s/ledger).
          example: 10
        lastUpdatedAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the indexed ledger close time.
          example: "2024-03-15T10:22:41Z"
        cursor:
          type: string
          description: >
            Opaque pagination/replay cursor. Do not parse — treat as a black box.
            Format is an implementation detail and may change.
          example: "1042857_0"

    FreshnessEnvelope:
      type: object
      description: Generic response wrapper pairing a data payload with freshness metadata.
      required:
        - data
        - freshness
      properties:
        freshness:
          $ref: '#/components/schemas/FreshnessMetadata'

    InvoiceStatus:
      type: string
      enum: [ Pending, Verified, Funded, Paid, Defaulted, Cancelled ]

    InvoiceCategory:
      type: string
      enum:
        [
          Services,
          Products,
          Consulting,
          Manufacturing,
          Technology,
          Healthcare,
          Other,
        ]

    LineItem:
      type: object
      required:
        - description
        - quantity
        - unit_price
        - total
      properties:
        description: { type: string }
        quantity: { type: string, description: "i128 as string" }
        unit_price: { type: string, description: "i128 as string" }
        total: { type: string, description: "i128 as string" }

    InvoiceMetadata:
      type: object
      required:
        - customer_name
        - customer_address
        - tax_id
        - line_items
        - notes
      properties:
        customer_name:
          type: string
        customer_address:
          type: string
        tax_id:
          type: string
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        notes: { type: string }

    FeeStructure:
      type: object
      required:
        - fee_type
        - base_fee_bps
        - min_fee
        - max_fee
        - is_active
        - updated_at
        - updated_by
      properties:
        fee_type:
          type: string
          enum: [Platform, Processing, Verification, EarlyPayment, LatePayment]
          description: Type of the fee
        base_fee_bps:
          type: integer
          description: Base fee in basis points
        min_fee:
          type: string
          description: Minimum fee amount as string (i128)
        max_fee:
          type: string
          description: Maximum fee amount as string (i128)
        is_active:
          type: boolean
          description: Whether this fee structure is currently active
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp of last update
        updated_by:
          type: string
          format: stellar-address
          description: Address of the admin who last updated the fee structure

    Invoice:
      type: object
      required:
        - id
        - business
        - amount
        - currency
        - due_date
        - status
        - description
        - category
        - tags
        - metadata
        - created_at
        - updated_at
      properties:
        id: { type: string }
        business: { type: string }
        amount: { type: string, description: "i128 as string" }
        currency: { type: string }
        due_date: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        description: { type: string }
        category: { $ref: "#/components/schemas/InvoiceCategory" }
        tags:
          type: array
          items: { type: string }
        metadata: { $ref: "#/components/schemas/InvoiceMetadata" }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    BidStatus:
      type: string
      enum: [ Placed, Withdrawn, Accepted, Expired, Cancelled ]

    Bid:
      type: object
      required:
        - bid_id
        - invoice_id
        - investor
        - bid_amount
        - expected_return
        - timestamp
        - status
        - expiration_timestamp
      properties:
        bid_id: { type: string }
        invoice_id: { type: string }
        investor: { type: string }
        bid_amount: { type: string, description: "i128 as string" }
        expected_return: { type: string, description: "i128 as string" }
        timestamp: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BidStatus" }
        expiration_timestamp: { type: integer, format: int64 }

    SettlementStatus:
      type: string
      enum: [ Pending, Paid, Defaulted ]

    Settlement:
      type: object
      required:
        - id
        - invoice_id
        - amount
        - payer
        - recipient
        - timestamp
        - status
      properties:
        id: { type: string }
        invoice_id: { type: string }
        amount: { type: string, description: "i128 as string" }
        payer: { type: string }
        recipient: { type: string }
        timestamp: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/SettlementStatus" }
        contract_version: { type: integer }
        event_schema_version: { type: integer }
        indexed_at: { type: string }

    InvestmentStatus:
      type: string
      enum: [Active, Completed, Defaulted, Refunded]

    PortfolioEntry:
      type: object
      properties:
        id: { type: string }
        investor: { type: string }
        invoice_id: { type: string }
        invested_amount: { type: string, description: "i128 as string" }
        expected_return: { type: string, description: "i128 as string" }
        status: { $ref: '#/components/schemas/InvestmentStatus' }
        invested_at: { type: integer, format: int64 }

    DisputeStatus:
      type: string
      enum: [ None, Disputed, UnderReview, Resolved ]

    Dispute:
      type: object
      required:
        - id
        - invoice_id
        - initiator
        - reason
        - status
        - created_at
      properties:
        id: { type: string }
        invoice_id: { type: string }
        initiator: { type: string }
        reason: { type: string }
        status: { $ref: "#/components/schemas/DisputeStatus" }
        created_at: { type: integer, format: int64 }
        resolved_at: { type: integer, format: int64 }

    PortfolioPageResult:
      type: object
      description: Paginated result wrapper for portfolio entries.
      required:
        - data
        - next_cursor
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioEntry'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when no more pages exist.
        has_more:
          type: boolean
          description: true when more items exist beyond this page.

    InvoicePageResult:
      type: object
      description: Paginated result wrapper for invoices.
      required:
        - data
        - next_cursor
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when no more pages exist.
        has_more:
          type: boolean
          description: true when more items exist beyond this page.

    BidPageResult:
      type: object
      description: Paginated result wrapper for bids.
      required:
        - data
        - next_cursor
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bid'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    DisputePageResult:
      type: object
      description: Paginated result wrapper for disputes.
      required:
        - data
        - next_cursor
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dispute'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    ErrorEnvelope:
      type: object
      description: Standard error response envelope used across all controllers.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - code
          properties:
            message:
              type: string
              description: Human-readable error description.
            code:
              type: string
              description: Machine-readable error code (SCREAMING_SNAKE_CASE).
            details:
              description: Optional extra details (omitted in production).
        _system:
          type: object
          properties:
            status: { type: string }
            degraded: { type: boolean }
            lag: { type: integer }
            level: { type: string }

    ErrorResponse:
      type: object
      description: Canonical error body for resource-level failures (404 responses).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - code
          properties:
            message:
              type: string
              description: Human-readable error description.
            code:
              type: string
              description: Machine-readable error code (SCREAMING_SNAKE_CASE).

    NotificationType:
      type: string
      enum:
        - invoice_funded
        - payment_received
        - dispute_opened
        - dispute_resolved

    UserNotificationPreferences:
      type: object
      properties:
        userId:
          type: string
        email_enabled:
          type: boolean
        email_address:
          type: string
          format: email
        notifications:
          type: object
          additionalProperties:
            type: boolean

    UpdateNotificationPreferences:
      type: object
      properties:
        email_enabled:
          type: boolean
        email_address:
          type: string
          format: email
        notifications:
          type: object
          additionalProperties:
            type: boolean

    Event:
      type: object
      description: A blockchain event to be processed for notifications.
      required:
        - type
      properties:
        type:
          type: string
          description: Event type identifier (e.g. InvoiceCreated, BidPlaced).
        data:
          type: object
          description: Event payload; shape varies by type.

  parameters:
    LimitParam:
      name: limit
      in: query
      description: Number of items per page. Clamped to [1, 100].
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    CursorParam:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's next_cursor field.
      schema:
        type: string

  responses:
    PaginationError:
      description: Invalid pagination parameters (bad limit or malformed cursor).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Unauthorized:
      description: Missing or invalid API credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              message: Authentication required
              code: UNAUTHORIZED
